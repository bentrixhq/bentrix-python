[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bentrix"
version = "0.1.0"
description = "The typed Python client of a running BENTRIX, generated from its capability catalogue."
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["bentrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
